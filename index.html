function hud(){panel(16,15,928,56);ctx.textAlign='left';ctx.font='11px monospace';ctx.fillStyle='#a7c7e9';[['SCORE',33],['COINS',185],['COURSE',325],['LIVES',630],['TIME',792]].forEach(([s,x])=>ctx.fillText(s,x,35));ctx.font='bold 18px monospace';ctx.fillStyle='white';ctx.fillText(String(score).padStart(6,'0'),33,57);ctx.fillStyle='#ffda64';ctx.fillText('● '+String(coins).padStart(2,'0'),185,57);ctx.fillStyle='white';ctx.fillText((level+1)+' · '+theme[level].name,325,57);ctx.fillStyle='#ff959b';ctx.fillText('♥ × '+lives,630,57);ctx.fillStyle=timer<40?'#ff8c8c':'white';ctx.fillText(String(Math.ceil(timer)),792,57);ctx.fillStyle='#ffffff25';ctx.fillRect(25,80,150,4);ctx.fillStyle='#ffdb6c';ctx.fillRect(25,80,Math.min(1,hero.x/world.goal)*150,4);if(hero.x<220&&state==='playing'){panel(205,112,550,58,'#142342a0');ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 16px monospace';ctx.fillText(level===2?'HOLD JUMP TO SWIM · ↓ TO DIVE':'HOLD JUMP FOR HEIGHT · RELEASE FOR SHORT HOPS',W/2,138);ctx.font='12px monospace';ctx.fillText('Reach the castle flag →',W/2,158);ctx.textAlign='left'}}
function overlay(title,line,detail){ctx.fillStyle='#080d23ae';ctx.fillRect(0,0,W,H);panel(110,145,740,245,'#19213bf0');ctx.textAlign='center';ctx.fillStyle='#ffdc78';ctx.font='bold 32px monospace';ctx.fillText(title,W/2,206);ctx.fillStyle='white';ctx.font='17px monospace';ctx.fillText(line,W/2,251);ctx.fillStyle='#b6c7e5';ctx.font='13px monospace';ctx.fillText(detail,W/2,286);if(state==='title'){panel(330,310,300,52,'#ffcf68');ctx.fillStyle='#242138';ctx.font='bold 21px monospace';ctx.fillText('▶ START + ENABLE SOUND',W/2,343)}ctx.textAlign='left'}
function render(){ctx.clearRect(0,0,W,H);if(state==='loading'||state==='error'){ctx.fillStyle='#11172c';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ffda64';ctx.font='bold 23px monospace';ctx.fillText(state==='error'?'ASSET ERROR — RELOAD TO RETRY':'BUILDING YOUR CASTLE WORLD…',W/2,H/2);ctx.textAlign='left';return}ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);background();drawWorld();ctx.restore();hud();if(state==='title')overlay('CASTLE ADVENTURE','Tap START to unlock music and sound effects','If your device blocks sound, tap the Sound button again.');if(state==='paused')overlay('PAUSED','Tap the game or press P to resume','Audio resumes after a tap if your browser interrupted it.');if(state==='gameover')overlay('GAME OVER','Every adventure starts with another try.','Tap the game / Enter / R to restart');if(state==='won')overlay(level===2?'ADVENTURE COMPLETE!':'COURSE CLEAR!','Score '+String(score).padStart(6,'0')+' · Coins '+coins,level===2?'Tap or press Enter to play again':'Tap or press Enter for the next course')}
function advance(){Audio.ensure();if(state==='title'||state==='paused')change('playing');else if(state==='won')start(level<2?level+1:0,level===2);else if(state==='gameover')start(level,true)}
function pause(){if(state==='playing')change('paused');else if(state==='paused'){Audio.ensure();change('playing')}}
function control(k,id,on){const was=input[k];if(on)held[k].add(id);else held[k].delete(id);input[k]=held[k].size>0;if(k==='jump'){if(!was&&input[k])jumpDown=true;if(was&&!input[k])jumpUp=true}}
function clear(){for(const k of Object.keys(input)){held[k].clear();input[k]=false}jumpDown=jumpUp=false}
const mapping={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',Space:'jump',ArrowUp:'jump',KeyW:'jump'};
// Capture touchstart as well as pointerdown for mobile browser audio policies.
function gesture(){Audio.ensure()}
for(const name of ['pointerdown','touchstart','mousedown'])document.addEventListener(name,gesture,{capture:true,passive:true});
window.addEventListener('keydown',e=>{const k=mapping[e.code];if(k||['KeyP','Escape','Enter','KeyR','KeyM'].includes(e.code))e.preventDefault();if(e.repeat)return;Audio.ensure();if(['loading','error'].includes(state))return;if(state==='title'&&(k||e.code==='Enter')){advance();return}if(k)control(k,'key:'+e.code,true);if(e.code==='KeyP'||e.code==='Escape')pause();if(e.code==='KeyR')start(level,true);if(e.code==='KeyM')toggleSound();if(e.code==='Enter')advance()});
window.addEventListener('keyup',e=>{const k=mapping[e.code];if(k)control(k,'key:'+e.code,false)});
document.querySelectorAll('[data-input]').forEach(b=>{const k=b.dataset.input;b.addEventListener('pointerdown',e=>{e.preventDefault();Audio.ensure();if(['title','paused','won','gameover'].includes(state))advance();b.setPointerCapture(e.pointerId);control(k,'pointer:'+e.pointerId,true)});const release=e=>{control(k,'pointer:'+e.pointerId,false)};b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release)});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();advance()});
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{Audio.ensure();if(['loading','error'].includes(state))return;clear();start(+b.dataset.level,true)}));
function toggleSound(){Audio.enabled=!Audio.enabled;document.querySelector('#audio').textContent=Audio.enabled?'♫ Sound ON':'♫ Sound OFF';if(Audio.enabled)Audio.ensure();else Audio.stop();Audio.updateStatus()}
document.querySelector('#audio').addEventListener('click',toggleSound);
document.querySelector('#pause').addEventListener('click',()=>{Audio.ensure();pause()});
function suspend(){clear();if(state==='playing')change('paused');Audio.stop()}
window.addEventListener('blur',suspend);window.addEventListener('pagehide',suspend);document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();else Audio.updateStatus()});

/* iPad/iPhone playback session and explicit user-gesture audio test. */
function configurePlaybackSession(){
 try{
  if('audioSession' in navigator){
   navigator.audioSession.type='playback';
   return navigator.audioSession.type==='playback';
  }
 }catch(error){console.warn('Playback session unavailable:',error)}
 return false;
}
configurePlaybackSession();

const testSoundButton=document.createElement('button');
testSoundButton.id='testSoundButton';
testSoundButton.type='button';
testSoundButton.textContent='🔊 Enable / Test Audio';
document.querySelector('header nav').appendChild(testSoundButton);
let audioTestInProgress=false;

testSoundButton.addEventListener('click',function(){
 if(audioTestInProgress)return;
 Audio.enabled=true;
 document.querySelector('#audio').textContent='♫ Sound ON';
 configurePlaybackSession();
 Audio.ensure();
 const context=Audio.context;
 if(!context){
  statusEl.textContent='Audio unavailable. Try opening the game directly in Safari.';
  return;
 }
 audioTestInProgress=true;
 testSoundButton.textContent='Testing audio…';
 function finish(){
  audioTestInProgress=false;
  testSoundButton.textContent='🔊 Enable / Test Audio';
 }
 function playTest(){
  if(context.state!=='running'){
   statusEl.textContent='Audio is '+context.state+'. Tap Enable / Test Audio again.';
   return;
  }
  const start=context.currentTime+.03;
  Audio.note(523.25,start,.22,'sine',.25);
  Audio.note(659.25,start+.25,.22,'sine',.25);
  Audio.note(783.99,start+.50,.35,'sine',.25);
  if(state==='playing')Audio.start();
  statusEl.textContent='Audio running — three test notes requested. If silent, check Silent Mode and volume.';
 }
 try{
  // Resume is called inside the trusted click, before any asynchronous work.
  const resumed=context.resume();
  Promise.resolve(resumed).then(playTest).catch(error=>{
   console.warn('Audio resume failed:',error);
   statusEl.textContent='Audio blocked. Open in Safari and tap this button again.';
  }).finally(finish);
 }catch(error){
  console.warn(error);
  statusEl.textContent='Could not resume audio. Tap to retry.';
  finish();
 }
});
document.addEventListener('click',configurePlaybackSession,{capture:true});
document.addEventListener('touchend',configurePlaybackSession,{capture:true,passive:true});

function frame(now){if(!last)last=now;acc+=Math.min((now-last)/1000,.075);last=now;while(acc>=STEP){update(STEP);acc-=STEP}render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);assets().then(()=>{start(0);change('title')}).catch(e=>{console.error(e);change('error')});
</script></body></html>
